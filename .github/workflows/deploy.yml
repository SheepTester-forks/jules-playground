name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build site using Allowlist
        run: |
          mkdir -p _site

          # ====================================================================
          # GITHUB PAGES ALLOWLIST
          # Edit this list to add or remove files/directories deployed to Pages.
          # ====================================================================
          ALLOWLIST=(
            "index.html"
            "iPhone save to files vs export unmodified originals/index.html"
            "iPhone save to files vs export unmodified originals/save to files/IMG_8099.HEIC"
            "iPhone save to files vs export unmodified originals/export unmodified originals/IMG_8099.HEIC"
            "iPhone save to files vs export unmodified originals/IMG_3592.jpg"
            "iPhone save to files vs export unmodified originals/IMG_3592.JPG"
            "Select 1000 files on iPhone without crashing Safari/Form.html"
          )

          echo "Deploying files from Allowlist:"
          for item in "${ALLOWLIST[@]}"; do
            if [ -e "$item" ]; then
              echo "  - Staging: $item"
              mkdir -p "_site/$(dirname "$item")"
              cp -r "$item" "_site/$item"
            else
              echo "  - Warning: $item not found, skipping."
            fi
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
