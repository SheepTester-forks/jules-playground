<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jules Playground - Interactive Tools & Analysis</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --card-hover-border: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      line-height: 1.6;
      padding: 2rem 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 640px) {
      .project-grid {
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      }
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .project-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
    }

    .project-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .project-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      align-self: flex-start;
    }

    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jules Playground</h1>
    <p>A directory of web-based analysis tools, interactive experiments, and iOS Safari utilities.</p>
  </header>

  <main>
    <div class="project-grid" id="project-directory">
      <!-- Project links defined in JS array below for easy future extension -->
    </div>
  </main>

  <footer>
    <p>Deployed via GitHub Pages</p>
  </footer>

  <script>
    // Directory configuration: Add new playground tools here!
    const PROJECTS = [
      {
        title: "Save to Files vs Export Unmodified Originals",
        description: "Interactive browser tool to analyze binary diffs, HEIF container boxes, EXIF metadata tags, and rendered pixel diffs between iPhone photo export modes.",
        path: "iPhone save to files vs export unmodified originals/index.html",
        tag: "Interactive Tool"
      },
      {
        title: "Select 1000 Files on iPhone Safari",
        description: "Demonstration of batch file accumulation on iOS Safari without UI crashes or memory overflow.",
        path: "Select 1000 files on iPhone without crashing Safari/Form.html",
        tag: "iOS Safari Utility"
      }
    ];

    const container = document.getElementById('project-directory');
    PROJECTS.forEach(proj => {
      const card = document.createElement('a');
      card.className = 'project-card';
      card.href = proj.path;
      card.innerHTML = `
        <div>
          <div class="project-title">
            ${proj.title}
            <span>&rarr;</span>
          </div>
          <div class="project-desc">${proj.description}</div>
        </div>
        <span class="project-tag">${proj.tag}</span>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
